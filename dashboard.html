<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CriticalArc Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #23262B; --panel: #2D3035; --border: #3E4248; --line: #34383E;
    --text: #F0F0F0; --muted: #8A8F98; --green: #39B54A; --red: #E04040;
    --yellow: #F4B942; --blue: #4A90D9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Barlow', sans-serif; }
  a { color: inherit; }

  .app { display: flex; min-height: 100vh; width: 100%; }

  /* ── Sidebar ─────────────────────────────────────────── */
  .sidebar { width: clamp(220px, 20vw, 300px); flex: 0 0 clamp(220px, 20vw, 300px);
    background: var(--panel); border-right: 1px solid var(--border); padding: 20px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .ca-brand { font-family: 'Barlow Condensed', sans-serif; font-size: 20px;
    font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    border-bottom: 2px solid var(--green); padding-bottom: 12px; margin-bottom: 20px; }
  .ca-brand-sub { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-top: 2px; }
  .side-label { font-size: 11px; letter-spacing: 1px; color: var(--muted);
    text-transform: uppercase; margin: 16px 0 6px; }
  select { width: 100%; background: #23262B; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-family: 'Barlow', sans-serif; font-size: 13px; }
  select:focus { outline: none; border-color: var(--muted); }
  /* Multi-select checkbox filter groups (empty selection = all) */
  .checkgroup { display: flex; flex-direction: column; gap: 5px; max-height: 190px; overflow-y: auto;
    background: #23262B; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .checkgroup label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text);
    cursor: pointer; }
  .checkgroup label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .checkgroup input[type="checkbox"] { accent-color: var(--green); width: 15px; height: 15px;
    flex: 0 0 auto; cursor: pointer; }
  .filter-hint { font-size: 11px; color: var(--muted); margin: 2px 0 8px; font-style: italic; }
  .hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  input[type="range"] { width: 100%; accent-color: var(--green); margin: 8px 0 4px; cursor: pointer; }
  .slider-wrap { color: var(--muted); font-size: 13px; margin: 4px 0 14px; }
  .slider-wrap b, .slider-wrap span { color: var(--green); font-weight: 600; }
  .eq-search-wrap { display: flex; gap: 12px; align-items: center; margin: 4px 0 12px; flex-wrap: wrap; }
  .eq-search-wrap input[type="text"] { flex: 1; min-width: 200px; background: #23262B; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-family: 'Barlow', sans-serif; font-size: 13px; }
  .eq-search-wrap input[type="text"]:focus { outline: none; border-color: var(--muted); }
  .eq-search-wrap label { color: var(--muted); font-size: 13px; white-space: nowrap; cursor: pointer;
    display: flex; align-items: center; gap: 6px; }
  .eq-search-wrap input[type="checkbox"] { accent-color: var(--green); width: 15px; height: 15px; cursor: pointer; }
  .refreshed { font-size: 11px; color: var(--muted); margin-top: 4px; }
  button.refresh { margin-top: 12px; width: 100%; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; background: transparent;
    color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 9px;
    cursor: pointer; transition: background .15s, border-color .15s; }
  button.refresh:hover { background: var(--line); border-color: var(--muted); }
  button.refresh:disabled { opacity: .5; cursor: default; }

  /* ── Main ────────────────────────────────────────────── */
  .main { flex: 1; padding: clamp(16px, 2vw, 28px) clamp(16px, 2.5vw, 36px); min-width: 0; }
  .page-title { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(28px, 4vw, 42px);
    font-weight: 700; letter-spacing: 1px; text-transform: uppercase; line-height: 1.1;
    color: var(--text); }
  .page-sub { font-size: 14px; color: var(--muted); margin-top: 4px; letter-spacing: .5px; }
  .page-meta { font-size: 12px; color: #5A5F68; margin-top: 6px; letter-spacing: .5px; }
  .title-hr { border: none; border-top: 1px solid var(--border); margin: 16px 0 8px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; background: var(--panel); padding: 4px;
    border-radius: 10px; border: 1px solid var(--border); margin: 16px 0 20px; width: fit-content; }
  .tab { background: transparent; border: none; border-radius: 6px; color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px;
    letter-spacing: .5px; padding: 8px 16px; cursor: pointer; }
  .tab.active { background: var(--line); color: var(--green); }
  
  /* FIXED TABS CSS to prevent Plotly legend truncation */
  .tabpage { height: 0; overflow: hidden; visibility: hidden; } 
  .tabpage.active { height: auto; overflow: visible; visibility: visible; }

  .section-header { font-family: 'Barlow Condensed', sans-serif; font-size: 12px;
    font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--green);
    margin: 24px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

  /* KPI cards */
  .kpi-row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .kpi-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px 24px; text-align: center; transition: border-color .2s; }
  .kpi-card:hover { border-color: var(--muted); }
  .kpi-label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .kpi-value { font-family: 'DM Mono', monospace; font-size: 32px; font-weight: 500;
    line-height: 1; margin-bottom: 4px; }
  .kpi-sub { font-size: 12px; color: var(--muted); }
  .kpi-red { color: var(--red); } .kpi-yellow { color: var(--yellow); }
  .kpi-green { color: var(--green); } .kpi-blue { color: var(--blue); } .kpi-white { color: var(--text); }

  .grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0,1fr); } }
  .kpi-row > *, .grid2 > * { min-width: 0; }

  /* ── Responsive: collapse sidebar to a top bar on narrow screens ── */
  @media (max-width: 860px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; flex: 0 0 auto; height: auto; position: static;
      border-right: none; border-bottom: 1px solid var(--border); }
    .main { padding: 16px; }
    .tabs { width: 100%; overflow-x: auto; }
    .eq-filters { grid-template-columns: 1fr; }
  }
  .chart { width: 100%; min-width: 0; }
  .eq-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 8px; }
  .caption { font-size: 12px; color: var(--muted); margin: 4px 0 12px; }

  /* Tables */
  table.dt { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 6px 0; }
  table.dt th { text-align: left; color: var(--muted); font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; letter-spacing: .5px; text-transform: uppercase; font-size: 11px;
    border-bottom: 1px solid var(--border); padding: 8px 10px; position: sticky; top: 0;
    background: var(--panel); }
  table.dt td { padding: 7px 10px; border-bottom: 1px solid #2A2D32; color: #D8DCE1; }
  table.dt tr:hover td { background: #282B30; }
  .table-wrap { max-height: 460px; overflow: auto; border: 1px solid var(--border);
    border-radius: 8px; background: var(--panel); }
  details { margin: 12px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  details > summary { cursor: pointer; padding: 12px 16px; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; letter-spacing: .5px; color: var(--muted); }
  details[open] > summary { border-bottom: 1px solid var(--border); color: var(--text); }
  details .table-wrap { border: none; border-radius: 0; }
  .empty { color: var(--muted); background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; margin: 10px 0; }
  .ok { color: var(--green); background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; margin: 10px 0; }
  #loading { padding: 40px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="ca-brand">CriticalArc<div class="ca-brand-sub">Project Dashboard Platform</div></div>
    <div class="side-label">Select Project</div>
    <select id="projectSelect"></select>
    <hr class="hr" />
    <div style="font-weight:600; letter-spacing:.5px;">Filters</div>
    <div class="filter-hint">Check any to filter — none checked = all.</div>
    <div class="side-label">Division / Discipline</div>
    <div class="checkgroup" id="fDiscipline"></div>
    <div class="side-label">Contractor / Assigned To</div>
    <div class="checkgroup" id="fContractor"></div>
    <div class="side-label">Status</div>
    <div class="checkgroup" id="fStatus"></div>
    <div class="side-label">Building Phase</div>
    <div class="checkgroup" id="fPhase"></div>
    <hr class="hr" />
    <div class="refreshed" id="refreshed"></div>
    <button class="refresh" id="refreshBtn">🔄 Refresh Data</button>
  </aside>

  <main class="main">
    <div id="loading">Loading data…</div>
    <div id="dash" style="visibility: hidden; height: 0; overflow: hidden;">
      <div class="page-title" id="pageTitle"></div>
      <div class="page-sub">Commissioning Progress Dashboard</div>
      <div class="page-meta" id="pageMeta"></div>
      <hr class="title-hr" />

      <div class="tabs">
        <button class="tab active" data-tab="issues">📋 Issue Tracking</button>
        <button class="tab" data-tab="checklists">✅ Checklists</button>
        <button class="tab" data-tab="tests">🧪 Functional Tests</button>
        <button class="tab" data-tab="equipment">🔧 Equipment</button>
      </div>

      <div class="tabpage active" id="tab-issues"></div>
      <div class="tabpage" id="tab-checklists"></div>
      <div class="tabpage" id="tab-tests"></div>
      <div class="tabpage" id="tab-equipment"></div>
    </div>
  </main>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  CriticalArc Dashboard — HTML/Plotly App rebuild
// ═══════════════════════════════════════════════════════════════════════

const REFRESH_ENDPOINT = null;

const FONT = 'Barlow, sans-serif';
const COND = 'Barlow Condensed, sans-serif';
const C = { text:'#F0F0F0', muted:'#8A8F98', border:'#3E4248', panel:'#2D3035',
  green:'#39B54A', red:'#E04040', yellow:'#F4B942', blue:'#4A90D9' };

let STATE = { project: null, data: null };

// ── tiny dataframe helpers ─────────────────────────────────────────────
const uniq = (arr) => [...new Set(arr)];
const isBad = (v) => v === null || v === undefined ||
  ['', 'nan', 'none', '0'].includes(String(v).trim().toLowerCase());
function valueCounts(rows, key) {
  const m = new Map();
  for (const r of rows) { const v = r[key]; if (v === null || v === undefined) continue;
    m.set(v, (m.get(v) || 0) + 1); }
  return m;
}
function groupSize(rows, key) {
  const m = valueCounts(rows, key);
  return [...m.entries()].map(([k, v]) => ({ key: k, count: v }));
}
function sumBy(rows, key) { let s = 0; for (const r of rows) s += (+r[key] || 0); return s; }

// ── shared Plotly styling ──────────────────────────────────────────────
const baseLayout = (extra = {}) => {
  const out = Object.assign({
    plot_bgcolor: 'rgba(0,0,0,0)', paper_bgcolor: 'rgba(0,0,0,0)',
    font: { family: FONT, size: 11, color: C.muted },
    margin: { t: 30, b: 30, l: 10, r: 10 },
    legend: {
      bgcolor: 'rgba(0,0,0,0)',
      font: { color: C.muted, size: 11 }
    },
  }, extra);
  out.xaxis = Object.assign({ gridcolor: C.border, tickfont: { color: C.muted }, automargin: true }, extra.xaxis || {});
  out.yaxis = Object.assign({ gridcolor: C.border, tickfont: { color: C.muted }, automargin: true }, extra.yaxis || {});
  return out;
};
const CFG = { displayModeBar: false, responsive: true };
function plot(id, traces, layout) { Plotly.react(id, traces, baseLayout(layout), CFG); }

// ── DOM builders ───────────────────────────────────────────────────────
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
function section(t) { return `<div class="section-header">${t}</div>`; }
function kpi(label, value, cls, sub) {
  return `<div class="kpi-card"><div class="kpi-label">${label}</div>
    <div class="kpi-value ${cls||'kpi-white'}">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;
}
function chartBox(id, h) { return `<div class="chart" id="${id}" style="height:${h||360}px"></div>`; }
function table(cols, rows) {
  const head = cols.map(c => `<th>${c.label}</th>`).join('');
  const body = rows.map(r => '<tr>' + cols.map(c =>
    `<td>${r[c.k] === null || r[c.k] === undefined ? '' : r[c.k]}</td>`).join('') + '</tr>').join('');
  return `<div class="table-wrap"><table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function phaseOf(r) {
  if (r.building_phase) return r.building_phase;
  return (STATE.eqPhase && STATE.eqPhase.get(String(r.asset_key))) || 'Unknown';
}

function applyFilters(rows) {
  const f = STATE.filters;
  return rows.filter(r => {
    if (f.discipline.length && !f.discipline.includes(r.discipline)) return false;
    if (f.contractor.length && !f.contractor.includes(r.assigned_company)) return false;
    if (f.status.length && !f.status.includes(r.status)) return false;
    if (f.phase.length && !f.phase.includes(phaseOf(r))) return false;
    return true;
  });
}

// ═══════════════════════════════════════════════════════════════════════
//  TAB 1 — ISSUE TRACKING
// ═══════════════════════════════════════════════════════════════════════
function renderIssues(issues) {
  const root = document.getElementById('tab-issues');
  if (!issues.length) { root.innerHTML = `<div class="empty">No issue data available.</div>`; return; }

  const open = issues.filter(i => i.status !== 'Closed');
  STATE.openIssues = open;
  const dopen = (i) => +i.days_open || 0;
  const esc90 = open.filter(i => dopen(i) > 90);
  const esc60 = open.filter(i => dopen(i) > 60 && dopen(i) <= 90);
  const esc30 = open.filter(i => dopen(i) > 30 && dopen(i) <= 60);
  const highPri = open.filter(i => (i.priority || '').includes('High'));

  let html = section('Key Metrics') + '<div class="kpi-row">' +
    kpi('Total Open Issues', open.length, open.length > 10 ? 'kpi-red' : 'kpi-yellow', 'non-closed') +
    kpi('Critical · &gt;90 Days', esc90.length, 'kpi-red', 'escalate now') +
    kpi('Escalate · 60–90 Days', esc60.length, 'kpi-yellow', 'past due') +
    kpi('Watch · 30–60 Days', esc30.length, 'kpi-blue', 'aging') +
    kpi('High Priority', highPri.length, 'kpi-red', 'open &amp; high') + '</div>';

  html += section('Issue Burn-Down &amp; Projection') + chartBox('iss-burndown', 420) +
    '<div class="caption" id="iss-burncap"></div>';

  html += section('Issue Breakdown') +
    `<div class="grid2">${chartBox('iss-priority', 400)}${chartBox('iss-status', 380)}</div>`;
  html += section('Issues by Contractor') + chartBox('iss-contractor', 400);

  html += section('Escalation by Contractor') +
    `<div class="slider-wrap">Show open issues aging more than
       <span id="iss-thval">${ISS_THRESH}</span> days
       <input type="range" id="iss-thresh" min="0" max="180" step="5" value="${ISS_THRESH}" /></div>
     <div id="iss-escalation"></div>`;

  html += section('Open Issues Detail');
  const openDetail = issues.filter(i => i.status !== 'Closed');
  if (openDetail.length) {
    const rows = openDetail.map(i => ({
      'Issue #': i.name,
      Aging: i.aging_category === '>60 Days' ? '🔴 >60 Days'
        : i.aging_category === '45-60 Days' ? '🟡 45-60 Days' : '🟢 Under 45 Days',
      'Days Open': i.days_open, Priority: i.priority, Division: i.discipline,
      'Assigned To': fmtAssigned(i), Status: i.status, Description: i.description,
    }));
    html += table(['Issue #','Aging','Days Open','Priority','Division','Assigned To','Status','Description']
      .map(k => ({ k, label: k })), rows);
  } else { html += `<div class="ok">✅ No open issues with current filters.</div>`; }

  const allRows = issues.map(i => ({
    'Issue #': i.name, Priority: i.priority, Status: i.status, Division: i.discipline,
    'Assigned To': fmtAssigned(i), 'Date Created': fmtDate(i.date_created),
    'In Progress Date': fmtDate(i.in_progress_date), 'Date Closed': fmtDate(i.date_closed),
    'Days Open': i.days_open, Description: i.description,
  }));
  html += `<details><summary>📄 View All Issues (${issues.length})</summary>` +
    table(['Issue #','Priority','Status','Division','Assigned To','Date Created',
      'In Progress Date','Date Closed','Days Open','Description'].map(k => ({ k, label: k })), allRows) +
    `</details>`;
  root.innerHTML = html;

  renderBurndown(issues);
  renderEscalation();
  const th = document.getElementById('iss-thresh');
  if (th) th.addEventListener('input', () => {
    ISS_THRESH = +th.value;
    document.getElementById('iss-thval').textContent = ISS_THRESH;
    renderEscalation();
  });

  const pri = groupSize(issues, 'priority').filter(d => !isBad(d.key));
  const sev = (p) => { p = p.toLowerCase();
    if (['critical','p0','high'].some(x => p.includes(x))) return 0;
    if (['moderate','p1','medium'].some(x => p.includes(x))) return 1;
    if (['low','p2','minor'].some(x => p.includes(x))) return 2; return 3; };
  pri.sort((a, b) => sev(a.key) - sev(b.key));
  const priScale = ['#E04040','#F4B942','#39B54A','#4A90D9','#8A8F98'];
  Plotly.react('iss-priority', [{
    type: 'pie', hole: 0.65, labels: pri.map(d => d.key), values: pri.map(d => d.count),
    marker: { colors: pri.map((_, i) => priScale[i % priScale.length]), line: { color: C.panel, width: 2 } },
    textinfo: 'none', hovertemplate: '<b>%{label}</b><br>%{value} (%{percent})<extra></extra>',
  }], baseLayout({
    title: { text: 'All Issues by Priority', font: { color: C.muted, family: COND, size: 12 } },
    showlegend: true,
    legend: { orientation: 'v', y: -0.1, yanchor: 'top', x: 0, xanchor: 'left' },
    margin: { t: 40, b: 120, l: 10, r: 10 }
  }), CFG);

  const statusColors = { Open:'#E04040','In Progress':'#4A90D9','Pending Review':'#F4B942',
    'Pending Verification':'#F4B942', Closed:'#39B54A', Void:'#8A8F98' };
  const st = groupSize(issues, 'status');
  plot('iss-status', [{ type: 'bar', x: st.map(d => d.key), y: st.map(d => d.count),
    marker: { color: st.map(d => statusColors[d.key] || C.muted) } }],
    { title: { text: 'All Issues by Status', font: { color: C.muted, family: COND, size: 12 } },
      margin: { t: 40, b: 40, l: 10, r: 10 } });

  const con = groupSize(issues, 'assigned_company').sort((a, b) => b.count - a.count).slice(0, 15);
  plot('iss-contractor', [{ type: 'bar', x: con.map(d => d.key), y: con.map(d => d.count),
    marker: { color: con.map(d => d.count), colorscale: 'Blues' } }],
    { title: { text: 'All Issues per Contractor', font: { color: C.muted, family: COND, size: 12 } },
      xaxis: { tickangle: -35, tickfont: { color: C.muted } }, margin: { t: 40, b: 90, l: 10, r: 10 } });
}
function fmtAssigned(r) {
  const n = String(r.assigned_name || '').trim(), c = String(r.assigned_company || '').trim();
  if (n && c && n !== c) return `${n} (${c})`; return c || n;
}
function fmtDate(v) { if (!v) return ''; const d = new Date(v); return isNaN(d) ? '' :
  `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`; }

let ISS_THRESH = 30;

function weekKey(dateStr) {
  const d = new Date(dateStr); if (isNaN(d)) return null;
  const m = new Date(d); m.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return m.toISOString().slice(0, 10);
}

function renderBurndown(issues) {
  const box = document.getElementById('iss-burndown');
  const cap = document.getElementById('iss-burncap');
  const cMap = new Map(), xMap = new Map();
  for (const i of issues) {
    if (i.date_created) { const w = weekKey(i.date_created); if (w) cMap.set(w, (cMap.get(w) || 0) + 1); }
    if (i.date_closed)  { const w = weekKey(i.date_closed);  if (w) xMap.set(w, (xMap.get(w) || 0) + 1); }
  }
  if (!cMap.size) { box.innerHTML = '<div class="empty">No dated issues to chart.</div>'; cap.textContent = ''; return; }
  const first = [...cMap.keys(), ...xMap.keys()].sort()[0];
  const weeks = [];
  for (let d = new Date(first); d <= new Date(); d.setDate(d.getDate() + 7)) weeks.push(d.toISOString().slice(0, 10));
  let cumC = 0, cumX = 0;
  const openY = [], weeklyClosed = [], weeklyCreated = [];
  for (const w of weeks) {
    cumC += cMap.get(w) || 0; cumX += xMap.get(w) || 0;
    openY.push(cumC - cumX); weeklyClosed.push(xMap.get(w) || 0); weeklyCreated.push(cMap.get(w) || 0);
  }
  Plotly.react('iss-burndown', [
    { type: 'bar', name: 'Opened', x: weeks, y: weeklyCreated, marker: { color: C.border } },
    { type: 'bar', name: 'Closed', x: weeks, y: weeklyClosed, marker: { color: C.green } },
    { type: 'scatter', mode: 'lines+markers', name: 'Open backlog', x: weeks, y: openY,
      line: { color: C.red, width: 2 }, marker: { size: 5 } },
  ], baseLayout({
    barmode: 'group',
    legend: { orientation: 'v', y: -0.15, yanchor: 'top', x: 0, xanchor: 'left' },
    xaxis: { gridcolor: C.border, tickfont: { color: C.muted } },
    yaxis: { title: 'Issues', gridcolor: C.border, tickfont: { color: C.muted } },
    margin: { t: 40, b: 100, l: 40, r: 10 }
  }), CFG);

  const last3 = weeklyClosed.slice(-3);
  const avg = last3.length ? last3.reduce((a, b) => a + b, 0) / last3.length : 0;
  const backlog = openY[openY.length - 1] || 0;
  if (avg > 0) {
    const wks = Math.ceil(backlog / avg);
    const proj = new Date(Date.now() + wks * 7 * 864e5);
    cap.innerHTML = `Trailing 3-week close rate: <b>${avg.toFixed(1)}</b>/wk · Open backlog: <b>${backlog}</b> · ` +
      `At this pace, cleared in ~<b>${wks}</b> weeks (${proj.toLocaleDateString('en-US')}). ` +
      `<span style="color:var(--muted)">Indicative — issue closures only.</span>`;
  } else {
    cap.innerHTML = `Open backlog: <b>${backlog}</b> · No closures in the last 3 weeks — projection unavailable.`;
  }
}

function renderEscalation() {
  const root = document.getElementById('iss-escalation');
  if (!root) return;
  const open = STATE.openIssues || [];
  const th = ISS_THRESH;
  const aged = open.filter(i => (+i.days_open || 0) > th);
  if (!aged.length) { root.innerHTML = `<div class="ok">✅ No open issues aging more than ${th} days.</div>`; return; }
  const cos = uniq(aged.map(i => i.assigned_company || 'Unassigned'));
  const rows = cos.map(co => {
    const r = aged.filter(i => (i.assigned_company || 'Unassigned') === co);
    const inBand = (lo, hi) => r.filter(i => { const d = +i.days_open || 0; return d > lo && (hi == null || d <= hi); }).length;
    return { Contractor: co, 'Aged Issues': r.length, '🔴 &gt;90d': inBand(90, null),
      '🟡 60–90d': inBand(60, 90), '🔵 30–60d': inBand(30, 60),
      'Oldest (days)': Math.max(...r.map(i => +i.days_open || 0)) };
  }).sort((a, b) => b['Aged Issues'] - a['Aged Issues']);
  root.innerHTML = `<div class="caption">${aged.length} open issue(s) aging more than ${th} days, across ${cos.length} contractor(s).</div>` +
    table(['Contractor','Aged Issues','🔴 &gt;90d','🟡 60–90d','🔵 30–60d','Oldest (days)'].map(k => ({ k, label: k })), rows);
}

const COMPLETE = ['Finished'];
function renderChecklists(cl) {
  const root = document.getElementById('tab-checklists');
  if (!cl.length) { root.innerHTML = `<div class="empty">No checklist data available.</div>`; return; }

  const levelsOrdered = ['L2','L3','L4','FAT'];
  const levelVals = new Set(cl.map(c => c.level));
  const active = levelsOrdered.filter(lv => levelVals.has(lv));

  let html = section('Checklist Status by Level') +
    `<div class="kpi-row" style="grid-template-columns:repeat(${active.length},minmax(0,1fr))">` +
    active.map((lv, i) => chartBox(`cl-donut-${i}`, 420)).join('') + '</div>';
  html += section('Completion by Discipline') + chartBox('cl-disc', 400);
  html += section('Checklists by Level &amp; Discipline') + chartBox('cl-leveldisc', 420);
  html += section('Open Checklists by Company &amp; Level') + chartBox('cl-company', 460);
  html += section('Completion by Contractor') + '<div id="cl-contractor-table"></div>';
  html += '<div id="cl-pending"></div>';
  root.innerHTML = html;

  const dcStatusColors = { 'Not Started':'#8A8F98','In Progress':'#F5A623',
    'GC to Verify':'#4A90D9','Finished':'#39B54A' };
  const levelColors = { L2:'#7F77DD', L3:'#1D9E75', L4:'#5DCAA5', FAT:'#85B7EB' };

  active.forEach((lv, i) => {
    const sub = cl.filter(c => c.level === lv);
    const sc = groupSize(sub, 'status');
    Plotly.react(`cl-donut-${i}`, [{
      type: 'pie', hole: 0.65, labels: sc.map(d => d.key), values: sc.map(d => d.count),
      marker: { colors: sc.map(d => dcStatusColors[d.key] || C.border) },
      textinfo: 'percent', textfont: { size: 10, color: '#23262B', family: FONT },
      hovertemplate: '%{label}: %{value}<extra></extra>',
    }], baseLayout({
      title: { text: lv, font: { size: 16, color: levelColors[lv] || C.text, family: COND }, x: 0.5, xanchor: 'center' },
      annotations: [{ text: `<b>${sub.length.toLocaleString()}</b>`, x: 0.5, y: 0.5, showarrow: false,
        font: { size: 20, color: C.text, family: COND } }],
      showlegend: true,
      legend: { orientation: 'v', y: -0.1, yanchor: 'top', x: 0, xanchor: 'left' },
      margin: { t: 30, b: 140, l: 5, r: 5 }
    }), CFG);
  });

  const discs = uniq(cl.map(c => c.discipline)).filter(d => !isBad(d));
  const dc = discs.map(d => {
    const rows = cl.filter(c => c.discipline === d);
    const done = rows.filter(c => COMPLETE.includes(c.status)).length;
    return { discipline: d, total: rows.length, done, remaining: rows.length - done,
      pct: rows.length ? +(done / rows.length * 100).toFixed(1) : 0 };
  }).sort((a, b) => a.total - b.total);
  plot('cl-disc', [
    { type: 'bar', orientation: 'h', y: dc.map(d => d.discipline), x: dc.map(d => d.done), name: 'Completed',
      marker: { color: C.green }, text: dc.map(d => d.done > 0 ? `${d.done} (${d.pct}%)` : ''),
      textposition: 'inside', textfont: { color: C.text, family: FONT } },
    { type: 'bar', orientation: 'h', y: dc.map(d => d.discipline), x: dc.map(d => d.remaining), name: 'Remaining',
      marker: { color: C.border }, text: dc.map(d => String(d.total)), textposition: 'outside',
      textfont: { color: C.muted, family: FONT } },
  ], { barmode: 'stack', legend: { orientation: 'v', y: -0.2, yanchor: 'top', x: 0, xanchor: 'left' },
    yaxis: { tickfont: { color: C.muted, size: 10 }, automargin: true }, margin: { t: 10, b: 100, l: 10, r: 40 } });

  const discColors = { Mechanical:'#E74C3C', Electrical:'#F5A623',
    'Electrical Power Monitoring System':'#4A90D9', 'Fire Protection':'#39B54A' };
  const discAbbr = { 'Electrical Power Monitoring System':'EPMS' };
  const ldTraces = discs.map(d => {
    const perLevel = active.map(lv => cl.filter(c => c.level === lv && c.discipline === d).length);
    return { type: 'bar', orientation: 'h', name: discAbbr[d] || d, y: active, x: perLevel,
      marker: { color: discColors[d] || C.muted }, text: perLevel.map(v => v || ''),
      textposition: 'inside', textfont: { color: '#23262B', family: FONT },
      hovertemplate: `${d}: %{x}<extra></extra>` };
  });
  plot('cl-leveldisc', ldTraces, { barmode: 'stack',
    yaxis: { categoryorder: 'array', categoryarray: [...active].reverse(), tickfont: { color: C.text, size: 13 }, automargin: true },
    legend: { orientation: 'v', y: -0.2, yanchor: 'top', x: 0, xanchor: 'left' },
    margin: { t: 40, b: 120, l: 10, r: 20 } });

  const openCl = cl.filter(c => !COMPLETE.includes(c.status) && active.includes(c.level));
  const coTotals = groupSize(openCl, 'assigned_company').sort((a, b) => b.count - a.count).slice(0, 10);
  const topCos = coTotals.map(d => d.key);
  const coTraces = active.map(lv => ({
    type: 'bar', name: lv, x: topCos,
    y: topCos.map(co => openCl.filter(c => c.assigned_company === co && c.level === lv).length),
    marker: { color: levelColors[lv] || C.muted },
  }));
  plot('cl-company', coTraces, { barmode: 'group',
    xaxis: { tickangle: -35, tickfont: { color: C.muted }, automargin: true },
    yaxis: { gridcolor: C.border, tickfont: { color: C.muted }, automargin: true },
    legend: { orientation: 'v', y: -0.3, yanchor: 'top', x: 0, xanchor: 'left' }, 
    margin: { t: 40, b: 160, l: 10, r: 10 } });

  const unassigned = ['not assigned yet','not assigned','','nan','none'];
  const classify = (c) => {
    const name = String(c.assigned_company || '').trim().toLowerCase();
    const atype = String(c.assigned_type || '').trim().toLowerCase();
    if (unassigned.includes(name)) return 'unassigned';
    if (atype === 'role') return 'role'; return 'contractor';
  };
  const contractorCl = cl.filter(c => classify(c) === 'contractor');
  const coSummary = uniq(contractorCl.map(c => c.assigned_company)).map(co => {
    const rows = contractorCl.filter(c => c.assigned_company === co);
    const done = rows.filter(c => COMPLETE.includes(c.status)).length;
    return { Contractor: co, Total: rows.length, Completed: done,
      'Completion %': rows.length ? +(done / rows.length * 100).toFixed(1) : 0 };
  }).sort((a, b) => b.Total - a.Total);
  document.getElementById('cl-contractor-table').innerHTML =
    table(['Contractor','Total','Completed','Completion %'].map(k => ({ k, label: k })), coSummary);

  const pending = cl.filter(c => ['role','unassigned'].includes(classify(c)));
  if (pending.length) {
    const ps = groupSize(pending, 'assigned_company').map(d => ({
      'Role / Status': unassigned.includes(String(d.key).trim().toLowerCase()) ? '⚠️ No Contractor Assigned' : d.key,
      Count: d.count })).sort((a, b) => b.Count - a.Count);
    document.getElementById('cl-pending').innerHTML =
      section('Pending Assignment') + table(['Role / Status','Count'].map(k => ({ k, label: k })), ps);
  }
}

//  TAB 3 — FUNCTIONAL TESTS
// ═══════════════════════════════════════════════════════════════════════
function renderTests(tests, issues) {
  const root = document.getElementById('tab-tests');
  if (!tests.length) { root.innerHTML = `<div class="empty">No functional test data available.</div>`; return; }
  issues = issues || [];

  const total = tests.length;
  const passed = tests.filter(t => t.status === 'Passed').length;
  const failed = tests.filter(t => t.status === 'Failed').length;
  const notStarted = tests.filter(t => t.status === 'Not Started').length;
  const passRate = total ? (passed / total * 100) : 0;

  let html = section('Functional Test Summary') + '<div class="kpi-row">' +
    kpi('Total Tests', total, 'kpi-white') + kpi('Passed', passed, 'kpi-green') +
    kpi('Failed', failed, 'kpi-red') + kpi('Not Started', notStarted, 'kpi-white') + '</div>';
  html += `<div class="grid2" style="margin-top:16px">
    <div>${section('Tests by Status')}${chartBox('ts-status', 400)}</div>
    <div>${section('Pass Rate')}${chartBox('ts-gauge', 360)}</div></div>`;
  html += section('Results by Equipment Unit') + chartBox('ts-unit', 420);
  html += section('Results by Contractor') + chartBox('ts-contractor', 420);
  html += section('Test Attempt Concentration') +
    `<div class="caption">More attempts = more re-testing effort (and burn). Darker cells are being run repeatedly.</div>` +
    chartBox('ts-heat', 340);
  html += section('Open Issues by Test Attempt Count') +
    `<div class="caption">How many open issues sit on equipment at each attempt level.</div>` +
    chartBox('ts-issattempt', 280);
  const allRows = tests.map(t => ({ Name: t.name, Status: t.status, 'Assigned To': t.assigned_name,
    Discipline: t.discipline, Attempts: t.attempt_count, Asset: t.asset_name }));
  html += `<details><summary>View All Tests (${tests.length})</summary>` +
    table(['Name','Status','Assigned To','Discipline','Attempts','Asset'].map(k => ({ k, label: k })), allRows) +
    `</details>`;
  root.innerHTML = html;

  const tsColors = { Passed:'#39B54A', Failed:'#E04040', 'Not Started':'#3E4248', 'In Progress':'#4A90D9' };
  const sc = groupSize(tests, 'status');
  Plotly.react('ts-status', [{ type: 'pie', hole: 0.65, labels: sc.map(d => d.key), values: sc.map(d => d.count),
    marker: { colors: sc.map(d => tsColors[d.key] || C.muted) }, textinfo: 'percent',
    textfont: { size: 11, color: C.text, family: FONT }, hovertemplate: '%{label}: %{value}<extra></extra>' }],
    baseLayout({ annotations: [{ text: `<b>${total}</b>`, x: 0.5, y: 0.5, showarrow: false,
      font: { size: 22, color: C.text, family: COND } }], showlegend: true,
      legend: { orientation: 'v', y: -0.1, yanchor: 'top', x: 0, xanchor: 'left' },
      margin: { t: 10, b: 120, l: 10, r: 10 } }), CFG);

  Plotly.react('ts-gauge', [{ type: 'indicator', mode: 'gauge+number', value: +passRate.toFixed(1),
    number: { suffix: '%', font: { size: 36, color: C.text, family: COND } },
    gauge: { axis: { range: [0, 100], tickfont: { color: C.muted } }, bar: { color: C.green },
      bgcolor: C.border, borderwidth: 0,
      threshold: { line: { color: C.text, width: 2 }, thickness: 0.75, value: passRate } } }],
    baseLayout({ margin: { t: 40, b: 10, l: 30, r: 30 } }), CFG);

  const unitOf = (a) => { const m = String(a || '').match(/^([A-Za-z]+\d+)/); return m ? m[1] : null; };
  const units = uniq(tests.map(t => unitOf(t.asset_name)).filter(Boolean)).sort();
  const byUnit = (st) => units.map(u => tests.filter(t => unitOf(t.asset_name) === u && t.status === st).length);
  plot('ts-unit', [
    { type: 'bar', name: 'Passed', x: units, y: byUnit('Passed'), marker: { color: C.green } },
    { type: 'bar', name: 'Failed', x: units, y: byUnit('Failed'), marker: { color: C.red } },
    { type: 'bar', name: 'Not Started', x: units, y: byUnit('Not Started'), marker: { color: C.border } },
  ], { barmode: 'stack', legend: { orientation: 'v', y: -0.2, yanchor: 'top', x: 0, xanchor: 'left' }, 
       margin: { t: 40, b: 120, l: 10, r: 10 } });

  const cos = uniq(tests.map(t => t.assigned_company)).map(co => {
    const rows = tests.filter(t => t.assigned_company === co);
    const p = rows.filter(t => t.status === 'Passed').length, f = rows.filter(t => t.status === 'Failed').length;
    return { co, total: rows.length, passed: p, failed: f, other: rows.length - p - f };
  }).sort((a, b) => a.total - b.total);
  plot('ts-contractor', [
    { type: 'bar', orientation: 'h', name: 'Passed', y: cos.map(d => d.co), x: cos.map(d => d.passed), marker: { color: C.green } },
    { type: 'bar', orientation: 'h', name: 'Failed', y: cos.map(d => d.co), x: cos.map(d => d.failed), marker: { color: C.red } },
    { type: 'bar', orientation: 'h', name: 'Not Started / In Progress', y: cos.map(d => d.co), x: cos.map(d => d.other), marker: { color: C.border } },
  ], { barmode: 'stack', legend: { orientation: 'v', y: -0.2, yanchor: 'top', x: 0, xanchor: 'left' },
    yaxis: { tickfont: { color: C.text, size: 11 } }, margin: { t: 40, b: 120, l: 10, r: 40 },
    height: Math.max(380, cos.length * 60) });

  const atts = uniq(tests.map(t => +t.attempt_count || 0).filter(n => n > 0)).sort((a, b) => a - b);
  const heatUnits = uniq(tests.map(t => unitOf(t.asset_name)).filter(Boolean)).sort();
  if (atts.length && heatUnits.length) {
    const z = heatUnits.map(u => atts.map(a =>
      tests.filter(t => unitOf(t.asset_name) === u && (+t.attempt_count || 0) === a).length));
    Plotly.react('ts-heat', [{
      type: 'heatmap', x: atts.map(a => a + (a === 1 ? ' attempt' : ' attempts')), y: heatUnits, z,
      colorscale: [[0, C.panel], [0.01, '#3E4248'], [0.5, C.yellow], [1, C.red]], showscale: true,
      xgap: 2, ygap: 2, hovertemplate: 'Unit %{y} · %{x} · %{z} test(s)<extra></extra>',
    }], baseLayout({ xaxis: { tickfont: { color: C.muted } },
      yaxis: { tickfont: { color: C.text, size: 10 }, automargin: true },
      margin: { t: 10, b: 30, l: 10, r: 10 } }), CFG);
  } else { document.getElementById('ts-heat').innerHTML = '<div class="empty">No attempt data to chart.</div>'; }

  const assetAttempt = new Map();
  for (const t of tests) { const k = String(t.asset_key); const a = +t.attempt_count || 0;
    assetAttempt.set(k, Math.max(assetAttempt.get(k) || 0, a)); }
  const issAttempt = atts.map(a => {
    const assets = new Set([...assetAttempt.entries()].filter(([, v]) => v === a).map(([k]) => k));
    return { a, n: issues.filter(i => i.status !== 'Closed' && assets.has(String(i.asset_key))).length };
  });
  if (issAttempt.some(d => d.n > 0)) {
    plot('ts-issattempt', [{ type: 'bar', x: issAttempt.map(d => '#' + d.a), y: issAttempt.map(d => d.n),
      marker: { color: C.red }, text: issAttempt.map(d => d.n || ''), textposition: 'outside',
      textfont: { color: C.muted, family: FONT } }],
      { xaxis: { title: 'Attempt count', tickfont: { color: C.muted } },
        yaxis: { title: 'Open issues', gridcolor: C.border, tickfont: { color: C.muted } },
        margin: { t: 10, b: 40, l: 40, r: 10 } });
  } else { document.getElementById('ts-issattempt').innerHTML = '<div class="empty">No open issues linked to tested equipment.</div>'; }
}

// ═══════════════════════════════════════════════════════════════════════
//  TAB 4 — EQUIPMENT
// ═══════════════════════════════════════════════════════════════════════
let EQ_FILTER = { bldg: 'All', floor: 'All' };
function renderEquipment(equipment, checklists, tests, issues) {
  const root = document.getElementById('tab-equipment');
  if (!equipment.length) { root.innerHTML = `<div class="empty">No equipment data available.</div>`; return; }

  const clAgg = new Map(), tsAgg = new Map(), issAgg = new Map();
  for (const c of checklists) { const k = String(c.asset_key);
    const a = clAgg.get(k) || { total: 0, done: 0 }; a.total++;
    if (COMPLETE.concat(['GC to Verify']).includes(c.status)) a.done++; clAgg.set(k, a); }
  for (const t of tests) { const k = String(t.asset_key);
    const a = tsAgg.get(k) || { total: 0, passed: 0, failed: 0 }; a.total++;
    if (t.status === 'Passed') a.passed++; if (t.status === 'Failed') a.failed++; tsAgg.set(k, a); }
  for (const i of issues) { const k = String(i.asset_key);
    const a = issAgg.get(k) || { total: 0, open: 0 }; a.total++;
    if (['Open','In Progress'].includes(i.status)) a.open++; issAgg.set(k, a); }

  const eq = equipment.map(e => {
    const k = String(e.equipment_id);
    const cl = clAgg.get(k) || { total: 0, done: 0 };
    const ts = tsAgg.get(k) || { total: 0, passed: 0, failed: 0 };
    const is = issAgg.get(k) || { total: 0, open: 0 };
    return { ...e, cl_total: cl.total, cl_done: cl.done, ts_total: ts.total, ts_passed: ts.passed,
      ts_failed: ts.failed, iss_total: is.total, iss_open: is.open };
  });

  const total = eq.length;
  const delivered = eq.filter(e => e.status === 'Delivered').length;
  const installing = eq.filter(e => e.status === 'Installation in Progress').length;
  const released = eq.filter(e => e.status === 'Released').length;

  const bldgs = ['All', ...uniq(eq.map(e => e.building_phase)).filter(b => b && b !== 'Unknown').sort()];
  const floors = ['All', ...uniq(eq.map(e => e.floor_parsed)).filter(f => f && f !== 'Unknown').sort()];

  let html = section('Equipment Overview') + '<div class="kpi-row">' +
    kpi('Total Equipment', total, 'kpi-white') + kpi('Released', released, 'kpi-white') +
    kpi('Delivered', delivered, 'kpi-blue') + kpi('Installing', installing, 'kpi-green') + '</div>';
  html += `<div class="eq-filters" style="margin-top:16px">
    <div><div class="side-label">Building Phase</div>
      <select id="eqBldg">${bldgs.map(b => `<option ${b===EQ_FILTER.bldg?'selected':''}>${b}</option>`).join('')}</select></div>
    <div><div class="side-label">Floor</div>
      <select id="eqFloor">${floors.map(f => `<option ${f===EQ_FILTER.floor?'selected':''}>${f}</option>`).join('')}</select></div>
  </div>`;
  html += `<div id="eq-body"></div>`;
  root.innerHTML = html;

  document.getElementById('eqBldg').onchange = (e) => { EQ_FILTER.bldg = e.target.value; renderEqBody(eq, total); };
  document.getElementById('eqFloor').onchange = (e) => { EQ_FILTER.floor = e.target.value; renderEqBody(eq, total); };
  renderEqBody(eq, total);
}

function renderEqBody(eq, total) {
  let f = eq;
  if (EQ_FILTER.bldg !== 'All') f = f.filter(e => e.building_phase === EQ_FILTER.bldg);
  if (EQ_FILTER.floor !== 'All') f = f.filter(e => e.floor_parsed === EQ_FILTER.floor);
  const body = document.getElementById('eq-body');
  if (!f.length) { body.innerHTML = `<div class="empty">No equipment matches these filters.</div>`; return; }

  let html = `<div class="caption">Showing ${f.length} of ${total} equipment</div>`;
  html += section('Equipment by Type') + chartBox('eq-type', 360);
  html += section('Checklist Completion by Equipment') +
    `<div class="caption">Sorted by lowest completion — the holdbacks rise to the top.</div>
     <div class="eq-search-wrap">
       <input type="text" id="eqSearch" placeholder="Search equipment name or type…" value="${EQ_SEARCH.q}" />
       <label><input type="checkbox" id="eqIncomplete" ${EQ_SEARCH.incompleteOnly ? 'checked' : ''}/> Incomplete only</label>
     </div>
     <div id="eq-cl-table"></div>`;
  const rows = f.map(e => ({ Name: e.name, Type: e.type, Discipline: e.discipline, Status: e.status,
    Space: e.space, Building: e.building_phase, Floor: e.floor_parsed, Checklists: e.cl_total,
    'CL Done': e.cl_done, Tests: e.ts_total, 'Tests Passed': e.ts_passed, Issues: e.iss_total, 'Issues Open': e.iss_open }));
  html += `<details><summary>View All Equipment (${f.length})</summary>` +
    table(['Name','Type','Discipline','Status','Space','Building','Floor','Checklists','CL Done',
      'Tests','Tests Passed','Issues','Issues Open'].map(k => ({ k, label: k })), rows) + `</details>`;
  body.innerHTML = html;

  const byType = (rows, agg) => {
    const types = uniq(rows.map(e => e.type));
    return types.map(t => { const r = rows.filter(e => e.type === t); return agg(t, r); });
  };

  let tsum = byType(f, (t, r) => ({ type: t, count: r.length })).sort((a, b) => a.count - b.count);
  plot('eq-type', [{ type: 'bar', orientation: 'h', y: tsum.map(d => d.type), x: tsum.map(d => d.count),
    marker: { color: C.blue }, text: tsum.map(d => d.count), textposition: 'outside',
    textfont: { color: C.muted, family: FONT } }],
    { yaxis: { tickfont: { color: C.text, size: 11 } }, margin: { t: 10, b: 20, l: 10, r: 40 },
      height: Math.max(300, tsum.length * 26) });

  renderEqTable(f);
  const sInput = document.getElementById('eqSearch'), sChk = document.getElementById('eqIncomplete');
  if (sInput) sInput.addEventListener('input', () => { EQ_SEARCH.q = sInput.value; renderEqTable(f); });
  if (sChk) sChk.addEventListener('change', () => { EQ_SEARCH.incompleteOnly = sChk.checked; renderEqTable(f); });
}

let EQ_SEARCH = { q: '', incompleteOnly: true };
function renderEqTable(eqRows) {
  const cont = document.getElementById('eq-cl-table');
  if (!cont) return;
  let r = eqRows.filter(e => e.cl_total > 0);
  if (EQ_SEARCH.incompleteOnly) r = r.filter(e => e.cl_done < e.cl_total);
  const q = EQ_SEARCH.q.trim().toLowerCase();
  if (q) r = r.filter(e => String(e.name || '').toLowerCase().includes(q) ||
    String(e.type || '').toLowerCase().includes(q));
  r = r.map(e => ({ e, pct: Math.round(e.cl_done / e.cl_total * 100) }))
    .sort((a, b) => a.pct - b.pct || (b.e.iss_open || 0) - (a.e.iss_open || 0));
  const rows = r.map(({ e, pct }) => ({
    Equipment: e.name, Type: e.type, Phase: e.building_phase, Floor: e.floor_parsed,
    'CL %': pct + '%', 'CL Done': `${e.cl_done}/${e.cl_total}`,
    'Open Issues': e.iss_open || 0, Tests: `${e.ts_passed}/${e.ts_total}`, Status: e.status,
  }));
  cont.innerHTML = `<div class="caption">${rows.length} equipment` +
    `${EQ_SEARCH.incompleteOnly ? ' with incomplete checklists' : ''}${q ? ` matching “${q}”` : ''}.</div>` +
    (rows.length ? table(['Equipment','Type','Phase','Floor','CL %','CL Done','Open Issues','Tests','Status']
      .map(k => ({ k, label: k })), rows) : '<div class="ok">✅ No matching equipment.</div>');
}

// ═══════════════════════════════════════════════════════════════════════
//  ORCHESTRATION
// ═══════════════════════════════════════════════════════════════════════
const STATUS_OPTIONS = ['Open','In Progress','Pending Review','Closed'];

function buildCheckGroup(id, values) {
  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  document.getElementById(id).innerHTML = values.map(v =>
    `<label><input type="checkbox" value="${esc(v)}" /><span title="${esc(v)}">${esc(v)}</span></label>`).join('');
}
function readCheckGroup(id) {
  return [...document.querySelectorAll(`#${id} input[type="checkbox"]:checked`)].map(i => i.value);
}

function rebuildFilterOptions() {
  const d = STATE.data;
  const disciplines = uniq(d.equipment.map(e => e.discipline)).filter(x => !isBad(x)).sort();
  const contractors = uniq(d.companies.map(c => c.name)).filter(x => !isBad(x)).sort();
  const phases = [...uniq(d.equipment.map(e => e.building_phase))
    .filter(x => x && x !== 'Unknown').sort(), 'Unknown'];
  buildCheckGroup('fDiscipline', disciplines);
  buildCheckGroup('fContractor', contractors);
  buildCheckGroup('fStatus', STATUS_OPTIONS);
  buildCheckGroup('fPhase', phases);
}

function renderAll() {
  const d = STATE.data;
  const issues = applyFilters(d.issues);
  const checklists = applyFilters(d.checklists);
  const tests = applyFilters(d.tests);
  const equipment = applyFilters(d.equipment);
  renderIssues(issues);
  renderChecklists(checklists);
  renderTests(tests, issues);
  renderEquipment(equipment, checklists, tests, issues);
  document.getElementById('pageTitle').textContent = d.project_name || 'Project Dashboard';
  const synced = d.data_synced_at ? new Date(d.data_synced_at) : null;
  const isData = !!(synced && !isNaN(synced));
  const stamp = isData ? synced : new Date();
  const prefix = isData ? 'Data as of: ' : 'Loaded: ';
  document.getElementById('pageMeta').textContent = prefix +
    stamp.toLocaleString('en-US', { month:'long', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
  document.getElementById('refreshed').textContent = prefix +
    stamp.toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

async function loadProject(pid) {
  // Use visibility rendering fixes rather than 'display: none'
  document.getElementById('loading').style.display = 'block';
  document.getElementById('dash').style.visibility = 'hidden';
  document.getElementById('dash').style.height = '0';
  document.getElementById('dash').style.overflow = 'hidden';
  
  const resp = await fetch(`shared-dashboard/html-dashboard/data/project_${pid}.json`);
  STATE.data = await resp.json();
  STATE.eqPhase = new Map(STATE.data.equipment.map(e => [String(e.equipment_id), e.building_phase]));
  STATE.filters = { discipline: [], contractor: [], status: [], phase: [] };
  EQ_FILTER = { bldg: 'All', floor: 'All' };
  rebuildFilterOptions();
  renderAll();
  
  // Expose container back to the front
  document.getElementById('loading').style.display = 'none';
  document.getElementById('dash').style.visibility = 'visible';
  document.getElementById('dash').style.height = 'auto';
  document.getElementById('dash').style.overflow = 'visible';
}

async function init() {
  document.querySelectorAll('.tab').forEach(btn => btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tabpage').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    window.dispatchEvent(new Event('resize'));
  });
  ['fDiscipline','fContractor','fStatus','fPhase'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      STATE.filters = {
        discipline: readCheckGroup('fDiscipline'),
        contractor: readCheckGroup('fContractor'),
        status: readCheckGroup('fStatus'),
        phase: readCheckGroup('fPhase'),
      };
      renderAll();
    });
  });
  document.getElementById('refreshBtn').onclick = async () => {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true; btn.textContent = '⏳ Refreshing…';
    try {
      if (REFRESH_ENDPOINT) { await fetch(REFRESH_ENDPOINT, { method: 'POST' }); }
      await loadProject(STATE.project);
    } finally { btn.disabled = false; btn.textContent = '🔄 Refresh Data'; }
  };

  const projects = await (await fetch('shared-dashboard/html-dashboard/data/projects.json')).json();
  const sel = document.getElementById('projectSelect');
  sel.innerHTML = projects.map(p => `<option value="${p.project_id}">${p.name}</option>`).join('');
  sel.onchange = () => { STATE.project = sel.value; loadProject(sel.value); };
  STATE.project = projects[0].project_id;
  await loadProject(STATE.project);
}

init().catch(e => { document.getElementById('loading').textContent = 'Error: ' + e.message; console.error(e); });
</script>
