<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Tamper Seal Request</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f5f5f5; color: #222; }
        .header { background: #1b5e20; color: white; padding: 22px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 20px; }
        .header p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); box-sizing: border-box; }
        .card p { color: #555; font-size: 14px; line-height: 1.5; margin-top: 0; }
        label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
        input[type=text], input[type=email], input[type=date], textarea, select {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; font-family: inherit;
        }
        textarea { min-height: 80px; resize: vertical; }
        button.submit-btn {
            width: 100%; padding: 16px; background: #1b5e20; color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer;
        }
        button.submit-btn:disabled { background: #aaa; }
        .success { text-align: center; padding: 40px 20px; }
        .success .icon { font-size: 48px; }
        .error-box { background: #ffebee; color: #c62828; padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 14px; }
        .loading { text-align: center; padding: 60px 20px; color: #999; }
        .empty-note { color: #999; text-align: center; padding: 10px 0; font-size: 14px; }

        .action-btn {
            display: block; width: 100%; padding: 20px; margin-bottom: 12px; border-radius: 10px; border: none;
            font-size: 17px; font-weight: bold; color: white; cursor: pointer; text-align: left;
        }
        .action-btn .sub { display: block; font-weight: normal; font-size: 12.5px; opacity: 0.9; margin-top: 3px; }
        .action-break-request { background: #1976d2; }
        .action-break-seals { background: #c62828; }
        .action-work-completed { background: #ef6c00; }
        .back-link { display: inline-block; margin-bottom: 12px; color: #1b5e20; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; }

        .seal-search-row { display: flex; gap: 8px; }
        .seal-search-row input { flex: 1; }
        .seal-search-row button {
            padding: 0 16px; border: none; border-radius: 8px; background: #2e7d32; color: white; font-weight: bold; cursor: pointer; font-size: 20px;
        }
        .seal-chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .seal-chip {
            display: flex; align-items: center; gap: 6px; background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7;
            border-radius: 20px; padding: 6px 8px 6px 14px; font-size: 13px; font-weight: 600;
        }
        .seal-chip .remove-chip { cursor: pointer; font-size: 16px; color: #d32f2f; line-height: 1; padding: 0 4px; }
        .new-seal-box { background: #fff3e0; border: 1px dashed #ef6c00; border-radius: 8px; padding: 14px; margin-top: 12px; }
        .new-seal-box p { margin: 0 0 10px; font-size: 13px; color: #e65100; font-weight: 600; }
        .new-seal-box input { margin-bottom: 8px; }
        .new-seal-box button { width: 100%; padding: 10px; background: #ef6c00; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="form-title">Tamper Seal Log</h1>
        <p id="form-subtitle">Loading...</p>
    </div>
    <div class="container">
        <div id="app-content" class="loading">Loading...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rcnxetcomdrlxvlarqoc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjbnhldGNvbWRybHh2bGFycW9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDIyMjksImV4cCI6MjA5MjAxODIyOX0.gP37sT5OrCOVRZXekMrBZHm5mtfnr6JrC2YGflWsDQU';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const params = new URLSearchParams(window.location.search);
        const PROJECT_KEY = params.get('project') || '';

        function T(table) { return `${PROJECT_KEY}${table}`; }

        let allSeals = [];
        let scriptUrl = '';
        let selectedSealIds = [];
        let newlyCreatedSeals = [];

        const sectionConfig = {
            'break-request': {
                title: 'Break Request',
                subtitle: 'Request approval to break a seal',
                eligible: s => !s.status || s.status.toLowerCase() === 'intact'
            },
            'break-seals': {
                title: 'Break Seals',
                subtitle: 'Log an approved seal break',
                eligible: s => (s.status || '').toLowerCase() === 'break approved by ccm'
            },
            'work-completed': {
                title: 'Work Completed',
                subtitle: 'Mark seals ready for reseal',
                eligible: s => (s.status || '').toLowerCase().includes('broken')
            }
        };

        async function init() {
            const content = document.getElementById('app-content');

            if (!PROJECT_KEY) {
                content.innerHTML = '<div class="card"><div class="error-box">This link is missing required information. Please contact your site admin.</div></div>';
                return;
            }

            document.getElementById('form-subtitle').innerText = 'What would you like to do?';

            try {
                const { data: project } = await _supabase
                    .from('launchpad_projects')
                    .select('google_script_url')
                    .eq('project_key', PROJECT_KEY)
                    .maybeSingle();
                scriptUrl = (project && project.google_script_url) || '';
            } catch (e) { console.warn('Could not load project config:', e); }

            const { data: seals, error } = await _supabase.from(T('Assets')).select('*');
            if (error) {
                content.innerHTML = '<div class="card"><div class="error-box">Could not load the seal log for this project. Please contact your site admin.</div></div>';
                return;
            }
            allSeals = seals || [];

            renderActionSelect();
        }

        function renderActionSelect() {
            document.getElementById('form-title').innerText = 'Tamper Seal Log';
            document.getElementById('form-subtitle').innerText = 'What would you like to do?';
            document.getElementById('app-content').innerHTML = `
                <button class="action-btn action-break-request" onclick="selectSection('break-request')">
                    🔒 Break Request
                    <span class="sub">Request approval before breaking a seal</span>
                </button>
                <button class="action-btn action-break-seals" onclick="selectSection('break-seals')">
                    ✂️ Break Seals
                    <span class="sub">Log a seal you've broken after approval</span>
                </button>
                <button class="action-btn action-work-completed" onclick="selectSection('work-completed')">
                    ✅ Work Completed
                    <span class="sub">Mark work done and ready for reseal</span>
                </button>
            `;
        }

        function selectSection(section) {
            selectedSealIds = [];
            const cfg = sectionConfig[section];
            document.getElementById('form-title').innerText = cfg.title;
            document.getElementById('form-subtitle').innerText = cfg.subtitle;

            const content = document.getElementById('app-content');
            if (section === 'break-request') renderBreakRequestForm(content);
            else if (section === 'break-seals') renderBreakSealsForm(content);
            else if (section === 'work-completed') renderWorkCompletedForm(content);
        }

        function backToActionSelect() {
            renderActionSelect();
        }

        function renderSealPickerHtml(section) {
            const eligible = allSeals.concat(newlyCreatedSeals).filter(sectionConfig[section].eligible);
            const datalistOptions = eligible.map(s =>
                `<option value="${s.seal_number}">${s.asset_name || ''}${s.location ? ' — ' + s.location : ''}</option>`
            ).join('');

            return `
                <label>Seal Number</label>
                <div class="seal-search-row">
                    <input type="text" id="seal-search-input" list="seal-datalist" placeholder="Type or select a seal number..." onkeydown="if(event.key==='Enter'){event.preventDefault(); handleAddSeal('${section}');}">
                    <datalist id="seal-datalist">${datalistOptions}</datalist>
                    <button type="button" onclick="handleAddSeal('${section}')" title="Add this seal">+</button>
                </div>
                <div id="new-seal-box-wrap"></div>
                <div id="seal-chip-list" class="seal-chip-list"></div>
            `;
        }

        function handleAddSeal(section) {
            const input = document.getElementById('seal-search-input');
            const value = input.value.trim();
            if (!value) return;

            const eligible = allSeals.concat(newlyCreatedSeals).filter(sectionConfig[section].eligible);
            const match = eligible.find(s => String(s.seal_number).trim() === value);

            if (match) {
                if (!selectedSealIds.includes(match.id)) selectedSealIds.push(match.id);
                input.value = '';
                document.getElementById('new-seal-box-wrap').innerHTML = '';
                renderSealChips();
                return;
            }

            document.getElementById('new-seal-box-wrap').innerHTML = `
                <div class="new-seal-box">
                    <p>Seal #${value} isn't in the log yet. Add it as a new seal?</p>
                    <input type="text" id="new-seal-asset" placeholder="Asset Name">
                    <input type="text" id="new-seal-location" placeholder="Location">
                    <input type="text" id="new-seal-subarea" placeholder="Sub Area (optional)">
                    <button type="button" onclick="createNewSeal('${value.replace(/'/g, "\\'")}')">Add Seal #${value} to This Request</button>
                </div>
            `;
        }

        async function createNewSeal(sealNumber) {
            const assetName = document.getElementById('new-seal-asset').value.trim();
            const location = document.getElementById('new-seal-location').value.trim();
            const subArea = document.getElementById('new-seal-subarea').value.trim();

            if (!assetName) {
                alert('Please enter an asset name for this seal.');
                return;
            }

            try {
                const { data, error } = await _supabase.from(T('Assets')).insert([{
                    asset_name: assetName,
                    location: location,
                    sub_area: subArea,
                    seal_number: sealNumber,
                    status: 'Intact',
                    inspection_date: new Date().toISOString().split('T')[0]
                }]).select();

                if (error || !data || data.length === 0) throw error || new Error('Insert failed');

                const newSeal = data[0];
                newlyCreatedSeals.push(newSeal);
                selectedSealIds.push(newSeal.id);
                document.getElementById('seal-search-input').value = '';
                document.getElementById('new-seal-box-wrap').innerHTML = '';
                renderSealChips();
            } catch (e) {
                alert('Could not add this seal: ' + e.message);
            }
        }

        function renderSealChips() {
            const wrap = document.getElementById('seal-chip-list');
            if (!wrap) return;
            const allKnown = allSeals.concat(newlyCreatedSeals);
            wrap.innerHTML = selectedSealIds.map(id => {
                const s = allKnown.find(x => x.id === id);
                if (!s) return '';
                return `<div class="seal-chip">Seal #${s.seal_number}<span class="remove-chip" onclick="removeSelectedSeal(${id})">&times;</span></div>`;
            }).join('');
        }

        function removeSelectedSeal(id) {
            selectedSealIds = selectedSealIds.filter(x => x !== id);
            renderSealChips();
        }

        function renderBreakRequestForm(content) {
            const uniqueAssetNames = [...new Set(allSeals.concat(newlyCreatedSeals).map(s => s.asset_name).filter(Boolean))].sort();

            content.innerHTML = `
                <a class="back-link" onclick="backToActionSelect()">&larr; Back</a>
                <div class="card">
                    <p>Select the asset(s) with the seal(s) you're requesting to break.</p>
                    <label>Asset(s)</label>
                    <div id="break-request-asset-list">
                        ${uniqueAssetNames.length > 0 ? uniqueAssetNames.map(name => `
                            <label class="seal-check">
                                <input type="checkbox" name="break-request-asset" value="${name}" onchange="updateBreakRequestSealList()">
                                ${name}
                            </label>
                        `).join('') : '<p class="empty-note">No assets with tamper seals found for this project.</p>'}
                    </div>

                    <label>Seal(s) to Break</label>
                    <div id="break-request-seal-list">
                        <p class="empty-note">Select an asset above to see its intact seals.</p>
                    </div>

                    <label>Reason for Request</label>
                    <textarea id="reason" placeholder="e.g. Scheduled testing, issue repair, settings change..."></textarea>
                    <label>Your Name</label>
                    <input type="text" id="reqName">
                    <label>Your Company</label>
                    <select id="reqCompany" onchange="handleReqCompanyChange()"><option value="">Loading companies...</option></select>
                    <input type="text" id="reqCompanyNew" placeholder="Enter your company name" style="display:none; margin-top:8px;">
                    <label>Your Email</label>
                    <input type="email" id="reqEmail">
                    <button class="submit-btn" onclick="submitBreakRequest()">Submit Break Request</button>
                    <div id="form-error"></div>
                </div>
            `;

            loadReqCompanyOptions();
        }

        function updateBreakRequestSealList() {
            const checkedAssets = Array.from(document.querySelectorAll('input[name="break-request-asset"]:checked')).map(el => el.value);
            const listEl = document.getElementById('break-request-seal-list');

            if (checkedAssets.length === 0) {
                listEl.innerHTML = '<p class="empty-note">Select an asset above to see its intact seals.</p>';
                return;
            }

            const eligible = allSeals.concat(newlyCreatedSeals).filter(s =>
                checkedAssets.includes(s.asset_name) && sectionConfig['break-request'].eligible(s)
            );

            listEl.innerHTML = eligible.length > 0 ? eligible.map(s => `
                <label class="seal-check">
                    <input type="checkbox" name="break-request-seal" value="${s.id}">
                    Seal #${s.seal_number}${s.sub_area ? ' — ' + s.sub_area : ''} — ${s.asset_name}
                </label>
            `).join('') : '<p class="empty-note">No intact seals found for the selected asset(s).</p>';
        }

        // Same source the rest of LaunchPad uses for Trade Partners,
        // paginated the same way to avoid Supabase's default row-limit
        // silently truncating the list on large dropdownoptions tables.
        async function fetchTradePartnersForProject() {
            const companies = [];
            let page = 0;
            const pageSize = 1000;
            let hasMore = true;

            while (hasMore) {
                const { data, error } = await _supabase
                    .from(T('dropdownoptions'))
                    .select('Trade_Partners')
                    .range(page * pageSize, (page + 1) * pageSize - 1);

                if (error || !data || data.length === 0) { hasMore = false; break; }

                data.forEach(row => {
                    const trade = row.Trade_Partners?.toString().trim();
                    if (trade && !companies.includes(trade)) companies.push(trade);
                });

                if (data.length < pageSize) hasMore = false;
                page++;
            }

            return companies.sort();
        }

        async function loadReqCompanyOptions() {
            const select = document.getElementById('reqCompany');
            try {
                const companies = await fetchTradePartnersForProject();
                select.innerHTML = '<option value="">Select Company...</option>' +
                    companies.map(c => `<option value="${c}">${c}</option>`).join('') +
                    '<option value="__add_new__">+ Add New Company</option>';
            } catch (e) {
                select.innerHTML = '<option value="">Select Company...</option><option value="__add_new__">+ Add New Company</option>';
            }
        }

        function handleReqCompanyChange() {
            const select = document.getElementById('reqCompany');
            const newInput = document.getElementById('reqCompanyNew');
            if (select.value === '__add_new__') {
                newInput.style.display = 'block';
                newInput.focus();
            } else {
                newInput.style.display = 'none';
            }
        }

        async function submitBreakRequest() {
            const checkedSealIds = Array.from(document.querySelectorAll('input[name="break-request-seal"]:checked')).map(el => Number(el.value));
            const reason = document.getElementById('reason').value.trim();
            const name = document.getElementById('reqName').value.trim();
            const companySelectValue = document.getElementById('reqCompany').value;
            const company = companySelectValue === '__add_new__'
                ? document.getElementById('reqCompanyNew').value.trim()
                : companySelectValue;
            const email = document.getElementById('reqEmail').value.trim();
            const errorEl = document.getElementById('form-error');
            errorEl.innerHTML = '';

            if (checkedSealIds.length === 0 || !reason || !name || !company || !email) {
                errorEl.innerHTML = '<div class="error-box">Please select at least one seal and fill in all fields.</div>';
                return;
            }

            try {
                const allKnown = allSeals.concat(newlyCreatedSeals);
                const selectedSeals = checkedSealIds.map(id => allKnown.find(s => s.id === id)).filter(Boolean);
                const sealNumbers = selectedSeals.map(s => s.seal_number).join(', ');
                const assetName = selectedSeals[0] ? selectedSeals[0].asset_name : '';
                const location = selectedSeals[0] ? selectedSeals[0].location : '';

                await _supabase.from(T('Assets'))
                    .update({
                        status: 'Break Requested (Pending Approval)',
                        break_request_date: new Date().toISOString().split('T')[0],
                        requestor_name: name,
                        requestor_company: company,
                        requestor_email: email
                    })
                    .in('id', checkedSealIds);

                await _supabase.from(T('BreakRequests')).insert([{
                    asset_name: assetName, location: location,
                    requested_seal_numbers: sealNumbers,
                    reason, requestor_name: name, requestor_company: company, requestor_email: email,
                    ccm_decision: 'Pending'
                }]);

                if (scriptUrl) {
                    try {
                        await fetch(`${scriptUrl}?action=notifyCCM&project=${encodeURIComponent(PROJECT_KEY)}&asset=${encodeURIComponent(assetName)}&seals=${encodeURIComponent(sealNumbers)}&requestor=${encodeURIComponent(name)}&requestorEmail=${encodeURIComponent(email)}`);
                    } catch (e) { console.warn('CCM notification failed:', e); }
                }

                showSuccess('Break Request Submitted', 'The Chain of Custody Manager has been notified and will review your request. You\'ll be notified by email once a decision has been made.');
            } catch (e) {
                errorEl.innerHTML = `<div class="error-box">Something went wrong: ${e.message}</div>`;
            }
        }

        function renderBreakSealsForm(content) {
            content.innerHTML = `
                <a class="back-link" onclick="backToActionSelect()">&larr; Back</a>
                <div class="card">
                    <p><strong>Only break seals the CCM has approved.</strong> Breaking a seal without an approval on file is treated as an unauthorized breach and triggers mandatory LOTO and re-inspection.</p>
                    ${renderSealPickerHtml('break-seals')}
                    <label>Break Date</label>
                    <input type="date" id="breakDate" value="${new Date().toISOString().split('T')[0]}">
                    <label>Name of Person Removing the Seal</label>
                    <input type="text" id="removerName">
                    <label>Company</label>
                    <input type="text" id="removerCompany">
                    <label>Detailed Break Reason</label>
                    <textarea id="breakReason"></textarea>
                    <button class="submit-btn" onclick="submitBreakSeals()">Log Seal Break</button>
                    <div id="form-error"></div>
                </div>
            `;
        }

        async function submitBreakSeals() {
            const breakDate = document.getElementById('breakDate').value;
            const removerName = document.getElementById('removerName').value.trim();
            const removerCompany = document.getElementById('removerCompany').value.trim();
            const breakReason = document.getElementById('breakReason').value.trim();
            const errorEl = document.getElementById('form-error');
            errorEl.innerHTML = '';

            if (selectedSealIds.length === 0 || !removerName || !breakReason) {
                errorEl.innerHTML = '<div class="error-box">Please add at least one seal and fill in all fields.</div>';
                return;
            }

            try {
                await _supabase.from(T('Assets'))
                    .update({
                        status: 'Broken - CCM Approved',
                        break_date: breakDate,
                        responsible_party: `${removerName}${removerCompany ? ' (' + removerCompany + ')' : ''}`,
                        break_reason: breakReason
                    })
                    .in('id', selectedSealIds);

                showSuccess('Seal Break Logged', 'The log has been updated. Use the Work Completed form once your work behind the seal is finished.');
            } catch (e) {
                errorEl.innerHTML = `<div class="error-box">Something went wrong: ${e.message}</div>`;
            }
        }

        function renderWorkCompletedForm(content) {
            content.innerHTML = `
                <a class="back-link" onclick="backToActionSelect()">&larr; Back</a>
                <div class="card">
                    <p>Let the CxA/CCM know these seals are ready to be replaced.</p>
                    ${renderSealPickerHtml('work-completed')}
                    <button class="submit-btn" onclick="submitWorkCompleted()">Notify Ready for Reseal</button>
                    <div id="form-error"></div>
                </div>
            `;
        }

        async function submitWorkCompleted() {
            const errorEl = document.getElementById('form-error');
            errorEl.innerHTML = '';

            if (selectedSealIds.length === 0) {
                errorEl.innerHTML = '<div class="error-box">Please add at least one seal.</div>';
                return;
            }

            try {
                const allKnown = allSeals.concat(newlyCreatedSeals);
                const selectedSeals = selectedSealIds.map(id => allKnown.find(s => s.id === id)).filter(Boolean);
                const assetName = selectedSeals[0] ? selectedSeals[0].asset_name : '';

                await _supabase.from(T('Assets'))
                    .update({
                        status: 'Ready for Reseal',
                        ready_for_reseal_date: new Date().toISOString().split('T')[0]
                    })
                    .in('id', selectedSealIds);

                if (scriptUrl) {
                    try {
                        await fetch(`${scriptUrl}?action=notifyCCM&project=${encodeURIComponent(PROJECT_KEY)}&asset=${encodeURIComponent(assetName)}&event=ready_for_reseal`);
                    } catch (e) { console.warn('Notification failed:', e); }
                }

                showSuccess('Marked Ready for Reseal', 'The CxA will coordinate re-sealing with the GC.');
            } catch (e) {
                errorEl.innerHTML = `<div class="error-box">Something went wrong: ${e.message}</div>`;
            }
        }

        function showSuccess(title, message) {
            document.getElementById('app-content').innerHTML = `
                <div class="card success">
                    <div class="icon">✅</div>
                    <h2 style="margin:10px 0 6px;">${title}</h2>
                    <p>${message}</p>
                </div>
                <a class="back-link" onclick="renderActionSelect()">&larr; Start another request</a>
            `;
        }

        init();
    </script>
</body>
</html>
