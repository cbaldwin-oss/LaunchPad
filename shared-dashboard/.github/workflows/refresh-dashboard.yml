name: Refresh dashboard data

# Rebuilds the CxAlloy → SQLite → JSON pipeline on a schedule and commits the
# refreshed JSON so the static (auth-proxied) dashboard always serves current data.
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CXALLOY_IDENTIFIER   — the CxAlloy API identifier
#   CXALLOY_SECRET       — the CxAlloy API secret
# The secret never reaches the browser; it lives only in the Action environment.

on:
  schedule:
    - cron: "0 * * * *"      # hourly, on the hour (UTC)
  workflow_dispatch: {}       # lets you trigger a refresh manually from the Actions tab

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # backstop: kill a stuck run instead of burning hours
    permissions:
      contents: write          # needed to commit the regenerated JSON
    env:
      # Where export_json.py writes the view-ready JSON. Point this at the folder
      # the dashboard's index.html fetches from (relative to the repo root).
      DASHBOARD_OUT_DIR: html-dashboard/data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Sync CxAlloy → SQLite (fresh in-runner build)
        env:
          CXALLOY_IDENTIFIER: ${{ secrets.CXALLOY_IDENTIFIER }}
          CXALLOY_SECRET: ${{ secrets.CXALLOY_SECRET }}
        run: python -c "from sync_logic import init_db, sync_all; init_db(); sync_all()"

      - name: Export view-ready JSON
        run: python export_json.py

      - name: Commit refreshed data (only if it changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${DASHBOARD_OUT_DIR}"
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "chore(data): scheduled dashboard refresh [skip ci]"
            git push
          fi
