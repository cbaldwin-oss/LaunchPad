<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pull Plan Scheduler</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
    <!-- Supabase client (needed immediately to load data) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <!-- Google Sheets sync (OAuth via Google Identity Services) — stays a
         real page-level script (not moved into bridge-view.js) since
         google.accounts.oauth2 must exist as a true global regardless of
         shadow DOM; the OAuth token-client flow itself never touches this
         page's DOM, so it works identically whether or not the code that
         calls it happens to live inside a shadow root. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        html, body { margin: 0; height: 100%; }
        bridge-view { height: 100%; }
    </style>
</head>
<body>
    <bridge-view></bridge-view>
    <script type="module">
        import './bridge-view.js';
    </script>
</body>
</html>
